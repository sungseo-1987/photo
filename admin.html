<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사역 사진 관리자 - AI 선별</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        .admin-card {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 16px;
            border: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-ai {
            background: #059669;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-ai:hover {
            background: #047857;
        }

        .status-badge {
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 99px;
            background: #e5e7eb;
        }
    </style>
</head>

<body>
    <div class="container" style="max-width: 600px;">
        <header>
            <h1>🔒 관리자 대시보드</h1>
            <p>사역 폴더를 관리하고 사진을 선별합니다</p>
        </header>

        <div id="ministry-list">
            <p style="text-align: center;">사역 목록을 불러오는 중...</p>
        </div>

        <div style="margin-top: 24px; text-align: center;">
            <button class="btn-submit" onclick="location.href='index.html'" style="background: #6b7280;">제출 페이지로
                돌아가기</button>
        </div>
    </div>

    <script>
        // 이 주소는 index.html에서 썼던 것과 동일해야 합니다.
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbwPxbwkQPXt2Pv_iAeINSr5_kkutYK4vV_8m8WfRl-nJwZn8Ffeu_Wt9FAGCGDkhctJ/exec';

        async function loadMinistries() {
            const listDiv = document.getElementById('ministry-list');
            try {
                const response = await fetch(GAS_URL);
                const folders = await response.json();

                listDiv.innerHTML = folders.map(f => `
                    <div class="admin-card">
                        <div>
                            <div style="font-weight: 700;">${f.name}</div>
                            <span class="status-badge">생성일: ${new Date(f.created).toLocaleDateString()}</span>
                        </div>
                        <button class="btn-ai" onclick="runAI('${f.id}', this)">AI 선별 실행</button>
                    </div>
                `).join('');
            } catch (err) {
                listDiv.innerHTML = '<p>목록 로드 실패: ' + err.message + '</p>';
            }
        }

        async function runAI(folderId, btn) {
            if (!confirm('AI 선별을 시작하시겠습니까? \n(원본 폴더에서 질 좋은 사진을 찾아 추천폴더로 복사합니다)')) return;

            const originalText = btn.innerText;
            btn.innerText = '🤖 분석 중...';
            btn.disabled = true;

            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'runSelection',
                        folderId: folderId
                    })
                });
                const result = await response.json();

                if (result.status === 'success') {
                    alert(`선별 완료!\n총 ${result.total}장 분석, ${result.selected}장 선별됨`);
                } else {
                    throw new Error(result.message);
                }
            } catch (err) {
                alert('선별 실패: ' + err.message);
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        loadMinistries();
    </script>
</body>

</html>
